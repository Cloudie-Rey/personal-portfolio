<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Reyaa Divakar</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400;700&family=NTR&display=swap" rel="stylesheet">
  
  <!-- Stylesheet -->
  <link rel="stylesheet" href="style.css?v=20261119-typing-fix-1">
</head>
<body>

  <!-- Top Navigation Bar -->
  <header>
    <div class="brand"><b>🌩️</b> Reyaa<span>Divakar</span></div>
    <nav class="top-menu" id="top-menu">
      <button class="menu-item on" data-tab="ov">About Me</button>
      <button class="menu-item" data-tab="res">Resume</button>
      <button class="menu-item" data-tab="eng">Tech Projects</button>
      <button class="menu-item" data-tab="biz">Experience</button>
      <button class="menu-item" data-tab="med">Creative</button>
      <button class="menu-item" data-tab="tun">Tunes</button>
      <button class="menu-item" data-tab="fun">Fun Facts</button>
      <button class="menu-item" data-tab="con">Contact</button>
    </nav>
    <button id="return-classic" type="button" hidden>Classic View</button>
    <div class="st">● SYSTEMS ONLINE</div>
    <button id="menu-toggle" type="button" aria-label="Toggle menu" aria-expanded="false" aria-controls="top-menu">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" fill="none"/></svg>
    </button>
  </header>

  <!-- Main Display View Canvas -->
  <main>
    <button id="spotify-toggle" aria-pressed="false" disabled>Loading music...</button>
    <!-- 3D Interactive Canvas Scene -->
    <section id="v3d" class="view">
      <div id="stage"></div>
      <div id="labels"></div>
      <div class="hint">Drag to orbit · scroll to zoom · click on a number and explore!</div>
      <div id="holiday-message" class="holiday-message" role="status" aria-live="polite" hidden>
        <span>Happy birthday to the dev! 🎂</span>
        <button id="holiday-message-close" type="button" aria-label="Dismiss message">×</button>
      </div>
      <div id="object-controls" hidden>
       <button id="back" type="button" aria-label="Back to workshop">
  <span class="back-arrow" aria-hidden="true">←</span>
  <span class="back-label">Back</span>
</button>
        <nav id="object-nav" aria-label="Navigate between workshop items">
          <button id="object-prev" type="button" aria-label="Previous item" title="Previous item">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg>
          </button>
          <span id="object-position" aria-live="polite"></span>
          <button id="object-next" type="button" aria-label="Next item" title="Next item">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg>
          </button>
        </nav>
      </div>
      <!-- Interactive Slide-out Modal -->
      <aside id="modal">
        <button class="x" id="mx" aria-label="Close">×</button>
        <div id="mb"></div>
        <div id="spotify-player" class="spotify-embed spotify-player-offscreen" aria-hidden="true">
          <div id="spotify-iframe"></div>
        </div>
      </aside>
    </section>

    <!-- Professional Modular Grid View -->
    <section id="vgrid" class="view on">
      <div class="gw">
        <div id="panel">
          <!-- Floating 3D Room Preview -->
          <button id="room-expand" class="floating-room-preview" type="button">
            <canvas id="room-preview-canvas" aria-hidden="true"></canvas>
            <span class="room-expand-label">click to view workspace</span>
          </button>
        </div>
      </div>
    </section>
  </main>

  <!-- Footer for Interactive View -->
  <footer class="site-footer interactive-footer" hidden>
    <div class="footer-content">
      <p>Built and designed by <span class="highlight">Reyaa Divakar</span>. All rights reserved. <span class="copyright-symbol">©</span></p>
    </div>
  </footer>

  <!-- External Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

  <!-- Application Logic -->
  <script type="module" src="script.js?v=20261119-typing-fix-1"></script>
</body>
</html>
